<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Question ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    font-size:42px;
    color:white;
}

p{
    color:white;
    font-size:22px;
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

#yes{
    background:#28a745;
    color:white;
    margin-right:30px;
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
}

#result{
    margin-top:30px;
    font-size:32px;
    color:white;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ I Like You ❤️</h1>

<p>Will you be my girlfriend? 🥺</p>

<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>

<div id="result"></div>

</div>

<script>

const no=document.getElementById("no");

function moveButton(){

const x=Math.random()*(window.innerWidth-150);

const y=Math.random()*(window.innerHeight-70);

no.style.left=x+"px";
no.style.top=y+"px";

}

no.addEventListener("mouseover",moveButton);
no.addEventListener("click",moveButton);

document.getElementById("yes").onclick=function(){

document.body.innerHTML=`
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
font-family:Arial;
color:white;
text-align:center;
font-size:42px;
padding:20px;">
<div>
🥹❤️<br><br>
You just made me the happiest person alive!<br><br>
Thank you for saying YES! ❤️
</div>
</div>
`;

}

</script>

</body>
</html>
