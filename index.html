<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For HER_NAME ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:bg 10s infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:650px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.25);
color:white;
z-index:5;
}

h1{
font-size:45px;
margin-bottom:20px;
}

#typing{
font-size:24px;
line-height:1.7;
min-height:140px;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#28a745;
color:white;
margin-right:25px;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:#ff4d6d;
color:white;
position:absolute;
}

.heart{
position:absolute;
color:white;
font-size:20px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{

0%{
transform:translateY(100vh) scale(.4);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

#final{
display:none;
font-size:35px;
line-height:1.8;
animation:fade 2s;
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div class="card">

<h1>Hi HER_NAME ❤️</h1>

<p id="typing"></p>

<br>

<button id="yes">Yes ❤️</button>

<button id="no">No 🙈</button>

<div id="final">
🥹❤️<br><br>

You just made me the happiest person alive.<br><br>

Thank you for giving us a chance.<br><br>

I promise to respect you, support you and make beautiful memories together.

<br><br>

Love,<br>

YOUR_NAME ❤️

</div>

</div>

<script>

const text="I've wanted to tell you this for a long time...\n\nEvery time we talk, you make my day brighter.\n\nWould you make me the happiest person by being my girlfriend? ❤️";

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i)=="\n"?"<br>":text.charAt(i);

i++;

setTimeout(type,45);

}

}

type();

const no=document.getElementById("no");

function move(){

let x=Math.random()*(window.innerWidth-150);

let y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";

no.style.top=y+"px";

}

no.addEventListener("mouseover",move);

no.addEventListener("click",move);

document.getElementById("yes").onclick=function(){

document.getElementById("typing").style.display="none";

document.getElementById("yes").style.display="none";

document.getElementById("no").style.display="none";

document.getElementById("final").style.display="block";

confetti();

}

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*5)+"s";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}

const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;

canvas.height=innerHeight;

function confetti(){

let pieces=[];

for(let i=0;i<250;i++){

pieces.push({

x:innerWidth/2,

y:innerHeight/2,

dx:(Math.random()-0.5)*10,

dy:(Math.random()-0.5)*10,

r:Math.random()*6+2

});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

pieces.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;

ctx.fill();

p.x+=p.dx;

p.y+=p.dy;

p.dy+=0.05;

});

requestAnimationFrame(draw);

}

draw();

}

</script>

</body>

</html>
