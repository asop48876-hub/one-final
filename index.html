<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading Screen -->

<div id="loader">

<div class="flower">

🌻

</div>

<h2>Preparing something special...</h2>

<div class="loading-bar">

<div class="progress"></div>

</div>

</div>

<!-- Main -->

<div id="main">

<!-- Background -->

<div class="aurora"></div>

<div class="stars"></div>

<div class="particles"></div>

<!-- Hero -->

<section class="hero">

<h3 id="greeting"></h3>

<h1 id="typing"></h1>

<p class="subtitle">

Some friendships don't need grand words...

they simply become a beautiful part of our story.

</p>

<button id="beginBtn">

Begin →

</button>

</section>

<!-- Name Popup -->

<div id="popup">

<div class="popup-card">

<h2>Welcome 🌻</h2>

<p>

Before we begin...

May I know your name?

</p>

<input

type="text"

id="username"

placeholder="Enter your name">

<button id="enter">

Continue</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
